# Calls keep_alive() in Supabase daily so the free tier (paused after 7 idle days) never pauses the project;
# scheduled runs can be delayed or skipped by GitHub, so daily leaves plenty of margin.
name: Supabase keep-alive
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/keep_alive" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
